[project]
name = "stash-phash"
version = "0.1.0"
description = "Stash-compatible perceptual hash (phash) generator for videos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pillow>=9.0.0",
    "click>=8.0.0",
]

[project.scripts]
stash-phash = "stash_phash.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stash_phash"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["stash_phash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
